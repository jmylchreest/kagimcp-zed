[package]
name = "kagi-mcp-server"
version = "0.0.30"
edition = "2021"
license = "MIT"
description = "Kagi MCP Server for AI assistants"
repository = "https://github.com/jmylchreest/kagimcp-zed"
readme = "README.md"
keywords = ["kagi", "mcp", "ai", "search", "summarizer"]
categories = ["command-line-utilities"]

[[bin]]
name = "kagi-mcp-server"
path = "src/main.rs"

[dependencies]
kagiapi = { version = "0.0.30", path = "../kagiapi" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1"
tokio = { version = "1", features = [
    "rt",
    "macros",
    "rt-multi-thread",
] }
clap = { version = "4", features = ["derive", "env"] }
rmcp = { version = "0.14", features = ["server", "transport-io", "macros"] }
